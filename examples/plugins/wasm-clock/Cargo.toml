# A minimal compiled Houston 2.0 plugin. Its own workspace so the main
# workspace's build never targets wasm.
#
# Build:  cargo build --release --target wasm32-unknown-unknown
# Output: target/wasm32-unknown-unknown/release/wasm_clock.wasm
#         → copy next to a plugin.json with runtime {"kind":"wasm","file":"wasm_clock.wasm"}.
[workspace]

[package]
name = "wasm-clock"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
opt-level = "z"
strip = true
