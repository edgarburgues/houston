name: release

# A v* tag (e.g. v0.3.0) cross-compiles the 6 binaries, generates SHA-256
# checksums and publishes a GitHub Release with everything attached. The
# installer downloads from here and verifies the checksum.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          targets="windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            out="dist/houston-${os}-${arch}"
            if [ "$os" = "windows" ]; then out="${out}.exe"; fi
            echo "→ $out"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" .
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum houston-* > checksums.txt && cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/houston-* dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
